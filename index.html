    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- FIREBASE SETUP ---
        const firebaseConfig = {
          apiKey: "AIzaSyBujn2I22eC_t2sUA-ViStOmVL1nMZ3Lxo",
          authDomain: "navrose-earning.firebaseapp.com",
          projectId: "navrose-earning",
          storageBucket: "navrose-earning.firebasestorage.app",
          messagingSenderId: "864112302885",
          appId: "1:864112302885:web:267c420e9ee34d7f4718cc"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        
        // --- HELPERS ---
        const compressImageToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onerror = reject;
            reader.onload = (event) => {
                if (event.target && typeof event.target.result === 'string') {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onerror = reject;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 800;
                        const scaleSize = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        if (ctx) {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', 0.7));
                        } else {
                            reject(new Error('Could not get canvas context.'));
                        }
                    };
                } else {
                    reject(new Error('FileReader result is not a string.'));
                }
            };
        });

        const Notification = ({ message, type, show, onHide }) => {
            useEffect(() => {
                if (show) {
                    const timer = setTimeout(() => onHide(), 5000);
                    return () => clearTimeout(timer);
                }
            }, [show, onHide]);
            return <div className={`notification ${type} ${show ? 'show' : ''}`}>{message}</div>;
        };

        const ConfirmModal = ({ show, message, onConfirm, onCancel }) => {
            if (!show) return null;
            return (
                <div className="modal-overlay">
                    <div className="modal-content">
                        <p>{message}</p>
                        <div className="modal-actions">
                            <button onClick={onCancel} className="btn-cancel">Cancel</button>
                            <button onClick={() => { onConfirm(); onCancel(); }} className="btn-confirm">Confirm</button>
                        </div>
                    </div>
                </div>
            );
        };
        
        const ImageModal = ({ src, onClose }) => {
            if (!src) return null;
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content image-modal-content" onClick={e => e.stopPropagation()}>
                        <button className="modal-close-btn" onClick={onClose}>&times;</button>
                        <img src={src} alt="Payment Proof" />
                    </div>
                </div>
            );
        };
        
        // --- ADVANCED TABLE COMPONENT ---
        const SortableTableView = ({ title, columns, data, footerData }) => {
            const [filter, setFilter] = useState('');
            const [sortConfig, setSortConfig] = useState({ key: columns[0].key, direction: 'descending' });

            const filteredAndSortedData = useMemo(() => {
                let filteredData = [...data];

                if (filter) {
                    const lowercasedFilter = filter.toLowerCase();
                    filteredData = filteredData.filter(item => {
                        return Object.values(item).some(value =>
                            String(value).toLowerCase().includes(lowercasedFilter)
                        );
                    });
                }
                
                if (sortConfig.key) {
                    filteredData.sort((a, b) => {
                        let aValue = a[sortConfig.key];
                        let bValue = b[sortConfig.key];

                        if (aValue?.toDate && typeof aValue.toDate === 'function') aValue = aValue.toDate();
                        if (bValue?.toDate && typeof bValue.toDate === 'function') bValue = bValue.toDate();
                        
                        if (aValue < bValue) return sortConfig.direction === 'ascending' ? -1 : 1;
                        if (aValue > bValue) return sortConfig.direction === 'ascending' ? 1 : -1;
                        return 0;
                    });
                }

                return filteredData;
            }, [data, filter, sortConfig]);
            
            const requestSort = (key) => {
                let direction = 'ascending';
                if (sortConfig.key === key && sortConfig.direction === 'ascending') {
                    direction = 'descending';
                }
                setSortConfig({ key, direction });
            };

            const computedFooterData = footerData ? footerData(filteredAndSortedData) : null;

            return (
                <div>
                    <h3>{title}</h3>
                    <div className="table-controls">
                        <input
                            type="text"
                            placeholder={`Search ${title}...`}
                            value={filter}
                            onChange={(e) => setFilter(e.target.value)}
                        />
                         <span>Showing {filteredAndSortedData.length} of {data.length} entries</span>
                    </div>
                    <div className="table-container">
                        <table className="data-table">
                            <thead>
                                <tr>
                                    {columns.map(col => (
                                        <th key={col.key} onClick={() => requestSort(col.key)}>
                                            {col.header} {sortConfig.key === col.key ? (sortConfig.direction === 'ascending' ? '▲' : '▼') : ''}
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {filteredAndSortedData.map((item, index) => (
                                    <tr key={item.id || index}>
                                        {columns.map(col => (
                                            <td key={col.key} style={col.isNumeric ? { textAlign: 'right' } : {}}>
                                                {col.render ? col.render(item) : (col.formatter ? col.formatter(item[col.key]) : item[col.key])}
                                            </td>
                                        ))}
                                    </tr>
                                ))}
                            </tbody>
                            {computedFooterData && (
                                <tfoot>
                                    <tr>
                                        {columns.map(col => (
                                            <td key={col.key} style={col.isNumeric ? { textAlign: 'right' } : {}}>
                                                {computedFooterData[col.key] || ''}
                                            </td>
                                        ))}
                                    </tr>
                                </tfoot>
                            )}
                        </table>
                    </div>
                </div>
            );
        };
        
        const UserEditModal = ({ user, onSave, onCancel }) => {
            const [formData, setFormData] = useState({ name: '', role: 'user', coins: 0 });
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (user) {
                    setFormData({
                        name: user.name || '',
                        role: user.role || 'user',
                        coins: user.coins || 0
                    });
                }
            }, [user]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: name === 'coins' ? Number(value) : value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                await onSave('users', user.id, formData, 'User updated successfully!', 'Failed to update user.');
                setLoading(false);
                onCancel();
            };

            if (!user) return null;

            return (
                <div className="modal-overlay">
                    <div className="modal-content">
                        <button className="modal-close-btn" onClick={onCancel}>&times;</button>
                        <h3>Edit User: {user.mobile}</h3>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label>Name</label>
                                <input type="text" name="name" value={formData.name} onChange={handleChange} required />
                            </div>
                            <div className="form-group">
                                <label>Role</label>
                                <select name="role" value={formData.role} onChange={handleChange}>
                                    <option value="user">User</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                            <div className="form-group">
                                <label>Coins</label>
                                <input type="number" name="coins" value={formData.coins} onChange={handleChange} required />
                            </div>
                            <div className="modal-actions">
                                <button type="button" className="btn-cancel" onClick={onCancel}>Cancel</button>
                                <button type="submit" className="btn-confirm" disabled={loading}>{loading ? 'Saving...' : 'Save Changes'}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- MAIN ADMIN APP ---
        const AdminApp = () => {
            const [adminView, setAdminView] = useState('dashboard');
            const [ads, setAds] = useState([]);
            const [users, setUsers] = useState([]);
            const [kitchenItems, setKitchenItems] = useState([]);
            const [kitchenOrders, setKitchenOrders] = useState([]);
            const [marketplaceOrders, setMarketplaceOrders] = useState([]);
            const [freelanceProfiles, setFreelanceProfiles] = useState([]);
            const [boosterOffers, setBoosterOffers] = useState([]);
            const [loginActivities, setLoginActivities] = useState([]);
            const [paymentSettings, setPaymentSettings] = useState(null);

            const [loading, setLoading] = useState(true);
            const [notification, setNotification] = useState({ show: false, message: '', type: '' });
            const [confirmModal, setConfirmModal] = useState({ show: false, message: '', onConfirm: () => {} });
            const [paymentProofUrl, setPaymentProofUrl] = useState(null);
            const [showNotifications, setShowNotifications] = useState(false);
            const notificationRef = useRef(null);
            
            const showNotification = (message, type = 'info') => setNotification({ show: true, message, type });
            const hideNotification = () => setNotification(prev => ({ ...prev, show: false }));
            const showConfirm = (message, onConfirm) => setConfirmModal({ show: true, message, onConfirm });
            const hideConfirm = () => setConfirmModal({ show: false, message: '', onConfirm: () => {} });

            useEffect(() => {
                const collections = {
                    'ads': setAds, 'users': setUsers, 'kitchenItems': setKitchenItems,
                    'kitchenOrders': setKitchenOrders, 'marketplaceOrders': setMarketplaceOrders,
                    'freelanceProfiles': setFreelanceProfiles, 'boosterOffers': setBoosterOffers, 
                    'login_activity': setLoginActivities
                };
                
                const unsubscribers = Object.entries(collections).map(([name, setter]) => {
                    let query = db.collection(name);
                    if (name === 'login_activity' && query.orderBy) {
                        query = query.orderBy('loginAt', 'desc');
                    } else if (name !== 'users' && query.orderBy) {
                        query = query.orderBy('createdAt', 'desc');
                    }
                    return query.onSnapshot(
                        snap => setter(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))),
                        err => console.error(`Error fetching ${name}:`, err)
                    );
                });

                const unsubSettings = db.collection('settings').doc('payment').onSnapshot(doc => {
                    setPaymentSettings(doc.exists ? { id: doc.id, ...doc.data() } : { upiId: '', qrCodeBase64: '' });
                }, err => console.error("Error fetching payment settings:", err));
                
                setTimeout(() => setLoading(false), 2500);
                
                const handleClickOutside = (event) => {
                    if (notificationRef.current && !notificationRef.current.contains(event.target)) {
                        setShowNotifications(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);

                return () => {
                    unsubscribers.forEach(unsub => unsub());
                    unsubSettings();
                    document.removeEventListener("mousedown", handleClickOutside);
                };
            }, []);
            
            const pendingAds = useMemo(() => ads.filter(ad => ad.status === 'pending'), [ads]);
            const pendingFreelancers = useMemo(() => freelanceProfiles.filter(p => p.status === 'pending'), [freelanceProfiles]);
            const pendingKitchenOrders = useMemo(() => kitchenOrders.filter(o => o.status === 'pending'), [kitchenOrders]);
            const pendingMarketplaceOrders = useMemo(() => marketplaceOrders.filter(o => o.status === 'pending'), [marketplaceOrders]);
            const totalPendingCount = pendingAds.length + pendingFreelancers.length + pendingKitchenOrders.length + pendingMarketplaceOrders.length;


            // --- CUD (Create, Update, Delete) Handlers ---
            const createOrUpdateDoc = async (collection, docId, data, successMsg, errorMsg) => {
                try {
                    if (docId) {
                        await db.collection(collection).doc(docId).set(data, { merge: true });
                    } else {
                        await db.collection(collection).add(data);
                    }
                    showNotification(successMsg, 'success');
                } catch (error) {
                    console.error(errorMsg, error);
                    showNotification(errorMsg, 'error');
                }
            };
            
            const deleteDoc = (collection, docId, successMsg, errorMsg) => {
                showConfirm(`Are you sure you want to permanently delete this item?`, async () => {
                    try {
                        await db.collection(collection).doc(docId).delete();
                        showNotification(successMsg, 'success');
                    } catch (error) { showNotification(errorMsg, 'error'); }
                });
            };

            const handleUpdateStatus = async (collection, docId, status, relatedDoc = {}) => {
                try {
                    await db.collection(collection).doc(docId).update({ status });
                    showNotification(`Status updated to ${status}.`, 'success');

                    const userId = relatedDoc.user;
                    if (userId) {
                        let message = '';
                        let link = '';
                        let shouldNotify = false;

                        if (collection === 'freelanceProfiles' && (status === 'active' || status === 'rejected')) {
                            message = `Congratulations! Your freelance profile has been ${status}.`;
                            link = 'myFreelanceProfile';
                            shouldNotify = true;
                        } else if (collection === 'kitchenOrders' || collection === 'marketplaceOrders') {
                            const orderId = docId.substring(0, 8).toUpperCase();
                             const statusMessages = {
                                confirmed: `Your order #${orderId} has been confirmed.`,
                                preparing: `Your order #${orderId} is being prepared.`,
                                shipped: `Your order #${orderId} has been shipped.`,
                                'out-for-delivery': `Your order #${orderId} is out for delivery.`,
                                delivered: `Your order #${orderId} has been delivered. We hope you enjoy!`,
                                cancelled: `Unfortunately, your order #${orderId} has been cancelled.`
                            };
                            if (statusMessages[status]) {
                                message = statusMessages[status];
                                link = 'myOrders';
                                shouldNotify = true;
                            }
                        }
                        
                        if (shouldNotify) {
                            await db.collection('notifications').add({
                                userId, message, link, read: false,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    }
                } catch (error) {
                    console.error(`Failed to update status or send notification for ${collection}/${docId}:`, error);
                    showNotification('Operation failed. Please check console for details.', 'error');
                }
            };

            const handleNavFromNotification = (view) => {
                setAdminView(view);
                setShowNotifications(false);
            };

            if (loading) return <div className="loading-container"><div className="spinner"></div></div>;

            return (
                <div className="app-container">
                    <Notification show={notification.show} message={notification.message} type={notification.type} onHide={hideNotification} />
                    <ConfirmModal show={confirmModal.show} message={confirmModal.message} onConfirm={confirmModal.onConfirm} onCancel={hideConfirm} />
                    <ImageModal src={paymentProofUrl} onClose={() => setPaymentProofUrl(null)} />
                    
                    <header className="header">
                        <h1>Navrose Admin</h1>
                        <div className="notification-area" ref={notificationRef}>
                            <button className="notification-btn" onClick={() => setShowNotifications(!showNotifications)}>
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"></path></svg>
                                {totalPendingCount > 0 && <span className="notification-badge">{totalPendingCount}</span>}
                            </button>
                            {showNotifications && (
                                <div className="notification-dropdown">
                                    <div className="notification-dropdown-header">Pending Items</div>
                                    {pendingMarketplaceOrders.length > 0 && <div className="notification-dropdown-item" onClick={() => handleNavFromNotification('marketplaceOrders')}><span>Pending Marketplace Orders</span> <strong>{pendingMarketplaceOrders.length}</strong></div>}
                                    {pendingKitchenOrders.length > 0 && <div className="notification-dropdown-item" onClick={() => handleNavFromNotification('kitchenOrders')}><span>Pending Kitchen Orders</span> <strong>{pendingKitchenOrders.length}</strong></div>}
                                    {pendingAds.length > 0 && <div className="notification-dropdown-item" onClick={() => handleNavFromNotification('adManagement')}><span>Pending Ads</span> <strong>{pendingAds.length}</strong></div>}
                                    {pendingFreelancers.length > 0 && <div className="notification-dropdown-item" onClick={() => handleNavFromNotification('freelance')}><span>Pending Freelancers</span> <strong>{pendingFreelancers.length}</strong></div>}
                                    {totalPendingCount === 0 && <div className="notification-dropdown-item"><span>No pending items</span></div>}
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="main-content">
                        <AdminPanel 
                            adminView={adminView}
                            setAdminView={setAdminView}
                            data={{ ads, users, kitchenItems, kitchenOrders, marketplaceOrders, freelanceProfiles, boosterOffers, loginActivities, paymentSettings }}
                            handlers={{ handleUpdateStatus, deleteDoc, createOrUpdateDoc, onShowProof: setPaymentProofUrl, showNotification }}
                            pendingCounts={{ ads: pendingAds.length, freelancers: pendingFreelancers.length, kitchenOrders: pendingKitchenOrders.length, marketplaceOrders: pendingMarketplaceOrders.length }}
                        />
                    </main>
                </div>
            );
        };
        
        const ReportsView = ({ kitchenOrders, marketplaceOrders, users, settings }) => {
            const [timeRange, setTimeRange] = useState('all'); // '7d', '30d', 'all'

            const filterOrdersByTime = (orders) => {
                 if (timeRange === 'all') return orders.filter(o => o.status === 'delivered');
                const now = new Date();
                const days = timeRange === '7d' ? 7 : 30;
                const cutoff = now.setDate(now.getDate() - days);
                return orders.filter(o => o.status === 'delivered' && o.createdAt && o.createdAt.toDate() > cutoff);
            };

            const filteredKitchenOrders = useMemo(() => filterOrdersByTime(kitchenOrders), [kitchenOrders, timeRange]);
            const filteredMarketplaceOrders = useMemo(() => filterOrdersByTime(marketplaceOrders), [marketplaceOrders, timeRange]);

            const kitchenRevenue = filteredKitchenOrders.reduce((sum, order) => sum + (order.finalTotal || 0), 0);
            const marketplaceRevenue = filteredMarketplaceOrders.reduce((sum, order) => sum + (order.finalTotal || 0), 0);
            const totalRevenue = kitchenRevenue + marketplaceRevenue;
            const totalOrders = filteredKitchenOrders.length + filteredMarketplaceOrders.length;
            const avgOrderValue = totalOrders > 0 ? totalRevenue / totalOrders : 0;
            const totalUsers = users.length;
            const totalCoinsLiability = users.reduce((sum, user) => sum + (user.coins || 0), 0) * (settings?.coinValue || 0.05);
            const businessEquity = totalRevenue - totalCoinsLiability;

            const kpis = [
                { title: 'Total Revenue', value: `₹${totalRevenue.toFixed(2)}` },
                { title: 'Kitchen Revenue', value: `₹${kitchenRevenue.toFixed(2)}` },
                { title: 'Marketplace Revenue', value: `₹${marketplaceRevenue.toFixed(2)}` },
                { title: 'Total Orders', value: totalOrders },
                { title: 'Avg. Order Value', value: `₹${avgOrderValue.toFixed(2)}` },
                { title: 'Total Users', value: totalUsers },
            ];
            
            return (
                <div className="reports-page">
                    <h2>Reports & Analytics</h2>
                    <div className="reports-controls">
                        <button className={`btn-${timeRange === '7d' ? 'approve' : 'cancel'}`} onClick={() => setTimeRange('7d')}>Last 7 Days</button>
                        <button className={`btn-${timeRange === '30d' ? 'approve' : 'cancel'}`} onClick={() => setTimeRange('30d')}>Last 30 Days</button>
                        <button className={`btn-${timeRange === 'all' ? 'approve' : 'cancel'}`} onClick={() => setTimeRange('all')}>All Time</button>
                    </div>
                    
                    <h3>Key Metrics</h3>
                    <div className="kpi-grid">
                        {kpis.map(kpi => (
                            <div key={kpi.title} className="kpi-card">
                                <h4>{kpi.title}</h4>
                                <p>{kpi.value}</p>
                            </div>
                        ))}
                    </div>
                    
                    <h3>Simplified Balance Sheet</h3>
                    <div className="balance-sheet-grid kpi-grid">
                         <div className="kpi-card"><h4>Total Revenue (Assets)</h4><p style={{color: 'var(--secondary-color)'}}>₹{totalRevenue.toFixed(2)}</p></div>
                         <div className="kpi-card"><h4>Coin Value (Liabilities)</h4><p style={{color: 'var(--danger-color)'}}>- ₹{totalCoinsLiability.toFixed(2)}</p></div>
                         <div className="kpi-card"><h4>Business Equity</h4><p>₹{businessEquity.toFixed(2)}</p></div>
                    </div>
                </div>
            );
        };

                    setCoinEligibleItemIds(currentSettings.coinEligibleItemIds || []);
                }

            const handleFileChange = async (e) => {

                    setQrCode(base64);
                }
            };

            const handlePromoItemToggle = (itemId) => {
                setPromoEligibleItemIds(prev => prev.includes(itemId) ? prev.filter(id => id !== itemId) : [...prev, itemId]);
            };

                setCoinEligibleItemIds(prev => prev.includes(itemId) ? prev.filter(id => id !== itemId) : [...prev, itemId]);
            };

            const handleSave = async (e) => {
                e.preventDefault(); setLoading(true);
                const settingsData = {
                    upiId,
                    qrCodeBase64: qrCode,
                    promoCode,
                    promoDiscount: Number(promoDiscount),
                    promoMinOrder: Number(promoMinOrder),
                    promoEligibleItemIds,
                    coinsPerOrder: Number(coinsPerOrder),
                    bonusCoins: Number(bonusCoins),
                    bonusThreshold: Number(bonusThreshold),
                    coinValue: Number(coinValue),
                    coinEligibleItemIds
                };
                await onSave('settings', 'payment', settingsData, 'Settings saved!', 'Failed to save settings.');
                setLoading(false);
            };

            if (!currentSettings) return <p>Loading settings...</p>;
            
            const itemSelectionListStyle = {
                maxHeight: '200px',
                overflowY: 'auto',
                border: '1px solid var(--border-color)',
                padding: '1rem',
                borderRadius: 'var(--border-radius)',
                display: 'flex',
                flexDirection: 'column',
                gap: '0.5rem'
            };

            return (
                <div className="form-container">
                    <h2>Payment & Loyalty Settings</h2>
                    <form onSubmit={handleSave}>
                        <h4>UPI Payment Settings</h4>
                        <div className="form-group">
                            <label>UPI ID</label>
                            <input type="text" value={upiId} onChange={e => setUpiId(e.target.value)} required />
                        </div>
                        <div className="form-group">
                            <label>QR Code Image</label>
                            <input type="file" accept="image/*" onChange={handleFileChange} />
                            {qrCode && <img src={qrCode} alt="QR Code Preview" className="image-preview" />}
                        </div>
                        <hr style={{margin: '2rem 0'}} />
                        <h4>Promo Code Settings</h4>
                        <div className="form-group"><label>Promo Code</label><input type="text" value={promoCode} onChange={e => setPromoCode(e.target.value)} /></div>
                        <div className="form-group"><label>Discount Percentage (%)</label><input type="number" value={promoDiscount} onChange={e => setPromoDiscount(e.target.value)} /></div>
                        <div className="form-group"><label>Minimum Order Value (₹)</label><input type="number" value={promoMinOrder} onChange={e => setPromoMinOrder(e.target.value)} /></div>
                        
                        <div className="form-group">
                            <label>Promo Code Item Eligibility</label>
                            <p style={{fontSize: '0.9rem', color: 'var(--text-color-light)', margin: '-0.5rem 0 1rem'}}>Select items the promo code applies to. The discount will only be calculated on these items.</p>
                            <div style={itemSelectionListStyle}>
                                {kitchenItems.length > 0 ? kitchenItems.map(item => (
                                    <label key={item.id} style={{fontWeight: 'normal', cursor: 'pointer'}}>
                                        <input
                                            type="checkbox"
                                            checked={promoEligibleItemIds.includes(item.id)}
                                            onChange={() => handlePromoItemToggle(item.id)}
                                        /> {item.name} (₹{item.price})
                                    </label>
                                )) : <p>No kitchen items found.</p>}
                            </div>
                        </div>

                        <hr style={{margin: '2rem 0'}} />
                        <h4>Coin Loyalty Settings</h4>

                        <div className="form-group"><label>Bonus Coins for Large Orders</label><input type="number" value={bonusCoins} onChange={e => setBonusCoins(e.target.value)} /></div>
                        <div className="form-group"><label>Bonus Threshold (₹)</label><input type="number" value={bonusThreshold} onChange={e => setBonusThreshold(e.target.value)} /></div>
                        <div className="form-group"><label>Coin Value (1 Coin = X Rupees)</label><input type="number" step="0.01" value={coinValue} onChange={e => setCoinValue(e.target.value)} /></div>
                        
                        <div className="form-group">
                            <label>Coin Earning Item Eligibility</label>
                            <p style={{fontSize: '0.9rem', color: 'var(--text-color-light)', margin: '-0.5rem 0 1rem'}}>Select items that are eligible for earning coins on purchase (when no promo is used).</p>
                             <div style={itemSelectionListStyle}>
                                {kitchenItems.length > 0 ? kitchenItems.map(item => (
                                    <label key={item.id} style={{fontWeight: 'normal', cursor: 'pointer'}}>
                                        <input
                                            type="checkbox"
                                            checked={coinEligibleItemIds.includes(item.id)}
                                            onChange={() => handleCoinItemToggle(item.id)}
                                        /> {item.name} (₹{item.price})
                                    </label>
                                )) : <p>No kitchen items found.</p>}
                            </div>
                        </div>

                        <div className="form-actions">
                            <button type="submit" disabled={loading}>{loading ? 'Saving...' : 'Save Settings'}</button>
                        </div>
                    </form>
                </div>
            );

        const FreelancerFormModal = ({ profile, onSave, onCancel, showNotification }) => {
            const [formData, setFormData] = useState({
                name: '', title: '', price: '', user: '', status: 'pending', imageBase64: null
            });
            const [loading, setLoading] = useState(false);
            const isEditing = !!profile;
        
            useEffect(() => {
                if (isEditing) {
                    setFormData({
                        name: profile.name || '',
                        title: profile.title || '',
                        price: profile.price || '',
                        user: profile.user || '',
                        status: profile.status || 'pending',
                        imageBase64: profile.imageBase64 || null
                    });
                } else {
                     setFormData({
                        name: '', title: '', price: '', user: '', status: 'pending', imageBase64: null
                    });
                }
            }, [profile]);
        
            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };
        
            const handleFileChange = async (e) => {
                if (e.target.files && e.target.files[0]) {
                    try {
                        const base64 = await compressImageToBase64(e.target.files[0]);
                        setFormData(prev => ({ ...prev, imageBase64: base64 }));
                    } catch (error) {
                        showNotification('Error processing image.', 'error');
                    }
                }
            };
        
            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.name || !formData.title || !formData.price || !formData.user || !formData.imageBase64) {
                    showNotification('Please fill all fields and provide an image.', 'error');
                    return;
                }
                if (!formData.user.startsWith('+91') || formData.user.length !== 13) {
                    showNotification('User mobile number must be in +91XXXXXXXXXX format.', 'error');
                    return;
                }
                setLoading(true);
                const dataToSave = { 
                    ...formData, 
                    createdAt: profile?.createdAt || firebase.firestore.FieldValue.serverTimestamp()
                };
                await onSave('freelanceProfiles', profile?.id, dataToSave, 'Profile saved!', 'Failed to save profile.');

                onCancel();
            };

                                <button type="button" className="btn-cancel" onClick={onCancel}>Cancel</button>
                                <button type="submit" className="btn-confirm" disabled={loading}>{loading ? 'Saving...' : 'Save Profile'}</button>

                    </div>

                            finalTotal: `₹${filteredData.filter(item => item.status !== 'cancelled').reduce((sum, item) => sum + (item.finalTotal || 0), 0).toFixed(2)}`
                        });
                        return <SortableTableView title="Marketplace Payment Ledger" columns={columns} data={marketplaceOrders} footerData={footerData} />;
                    }
                    case 'paymentSettings': return <PaymentSettingsView currentSettings={paymentSettings} kitchenItems={kitchenItems} onSave={createOrUpdateDoc} />;
                    case 'users': {
                         const columns = [
                            { key: 'name', header: 'Name' },
                            { key: 'mobile', header: 'Contact' },
                            { key: 'role', header: 'Role' },
                            { key: 'coins', header: 'Coins', isNumeric: true },
                            { key: 'actions', header: 'Actions', render: (item) => (
                                <div className="ad-actions">
                                    <button className="btn-edit" onClick={() => setEditingUser(item)}>Edit</button>
                                    <button className="btn-delete" onClick={() => deleteDoc('users', item.id, 'User deleted.', 'Failed to delete user.')}>Delete</button>
                                </div>
                            ) }
                        ];
                         const footerData = (filteredData) => ({
                            name: `Total Users: ${filteredData.length}`,
                            coins: filteredData.reduce((sum, item) => sum + (item.coins || 0), 0)
                        });
                        return <SortableTableView title="User Management" columns={columns} data={users} footerData={footerData} />;
                    }
                    case 'loginActivity': {
                         const columns = [
                            { key: 'loginAt', header: 'Time', formatter: (ts) => ts ? ts.toDate().toLocaleString() : 'N/A' },
                            { key: 'userId', header: 'User ID' },
                        ];
                        return <SortableTableView title="Login Activity" columns={columns} data={loginActivities} />;
                    }
                    default: return (
                        <div className="dashboard-page">
                            <h2>Admin Dashboard</h2>
                            <div className="dashboard-grid">
                                {adminServices.map(service => (
                                    <div key={service.name} className="dashboard-icon-card" onClick={() => setAdminView(service.view)}>
                                        {service.count > 0 && <span className="item-count-badge">{service.count}</span>}
                                        <div className="icon-wrapper">{service.icon}</div>
                                        <p>{service.name}</p>
                                    </div>
                                ))}
                            </div>
                        </div>);
                 }
            };
            
            return (
                <div>
                    {editingUser && <UserEditModal user={editingUser} onSave={createOrUpdateDoc} onCancel={() => setEditingUser(null)} />}
                    {adminView !== 'dashboard' && (
                        <>
                            <button onClick={() => setAdminView('dashboard')} style={{ marginBottom: '1rem' }}>&larr; Back to Dashboard</button>
                        </>
                    )}
                    {renderContent()}
                </div>
            );
        };
        
        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<AdminApp />);
        }
    </script>

<script></script>
<script src="./script.js"></script></body></html>
